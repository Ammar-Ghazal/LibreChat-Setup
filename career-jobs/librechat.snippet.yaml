# Merge into your existing librechat.yaml; never duplicate top-level keys.
mcpSettings:
  allowedAddresses:
    - 'jobs:8000'
mcpServers:
  career_jobs:
    type: streamable-http
    url: http://jobs:8000/mcp
    requiresOAuth: false
    serverInstructions: true
    timeout: 30000
    initTimeout: 30000
